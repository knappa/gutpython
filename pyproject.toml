[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "gutpython"
dynamic = ["version"]
authors = [
    { name = "Adam C Knapp", email = "adam.knapp@medicine.ufl.edu" },
]
description = "Implementation of GutLogo in Python"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy",
    "h5py",
]

[project.scripts]
#pruning = "pruning:main_cli"
#pruning_stack = "pruning.stack:main_cli"
#pruning_halfstack = "pruning.halfstack:main_cli"


[project.urls]
Homepage = "https://github.com/knappa/gutpython"
Issues = "https://github.com/knappa/gutpython"