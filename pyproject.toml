[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "gutpython"
version = "0.0.0"
authors = [
    { name = "Adam C Knapp", email = "adam.knapp@medicine.ufl.edu" },
]
description = "Implementation of GutLogo in Python"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "numpy",
    "h5py",
    "attrs",
    "matplotlib",
    "dill",
]

[project.optional-dependencies]
all = [
    "jupyter",
    "ipympl",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/knappa/gutpython"
Issues = "https://github.com/knappa/gutpython"